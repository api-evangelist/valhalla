name: Valhalla
description: >-
  Valhalla is an open-source routing engine and library suite for OpenStreetMap
  data. It provides turn-by-turn navigation, isochrone computation, time-distance
  matrix analysis, map matching, elevation sampling, optimized routing (TSP), and
  graph expansion via a REST API. Valhalla supports multiple travel modes including
  auto, bicycle, pedestrian, transit, truck, motorcycle, and motor scooter. It uses
  a tiled hierarchical data structure for efficient offline routing and regional
  extracts, with dynamic costing via a plugin architecture.
accessModel:
  pricing: free
  onboarding: unknown
  trial: false
  try_now: false
